name: commaviewd-ci

# CI is the last check before a change lands, not the way to test it: run scripts/ci-local.sh
# while you work. A pull request runs once it's ready for review (drafts don't); main runs on
# every push. The targets are in ci/targets.json; the checks, in commaviewd-verify.yml, skip
# whatever already passed for the same content (a merged pull request's commit, for one).
# For branch protection, require "verify / result": it reports on every run.
on:
  push:
    branches: [main]
    paths:
      - 'commaviewd/**'
      - 'comma/**'
      - 'comma4/install.sh'
      - 'tools/**'
      - 'scripts/**'
      - 'ci/**'
      - '.github/workflows/commaviewd-ci.yml'
      - '.github/workflows/commaviewd-verify.yml'
      - '.github/workflows/commaviewd-release.yml'
      - '.github/workflows/runtime-rollout.yml'
      - '.github/workflows/runtime-promote.yml'
      - '.github/scripts/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'commaviewd/**'
      - 'comma/**'
      - 'comma4/install.sh'
      - 'tools/**'
      - 'scripts/**'
      - 'ci/**'
      - '.github/workflows/commaviewd-ci.yml'
      - '.github/workflows/commaviewd-verify.yml'
      - '.github/workflows/commaviewd-release.yml'
      - '.github/workflows/runtime-rollout.yml'
      - '.github/workflows/runtime-promote.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  # Pass markers from pull requests count only after checking the pull request isn't a fork's.
  pull-requests: read

concurrency:
  group: commaviewd-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/commaviewd-verify.yml
    with:
      targets: ci/targets.json
