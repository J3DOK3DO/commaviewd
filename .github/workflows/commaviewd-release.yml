name: commaviewd-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'alpha: the next v<version>-alpha.<n> from main. beta: the version''s beta, from its newest alpha (or from)'
        required: false
        default: alpha
        type: choice
        options:
          - alpha
          - beta
      from:
        description: 'Beta only: the alpha to make the beta from (default: the newest), e.g. v0.0.56-alpha.2'
        required: false
        default: ''
        type: string
      tag:
        description: 'Rebuild an existing tag instead (with allow_overwrite). Empty: cut a new release (channel)'
        required: false
        default: ''
        type: string
      allow_overwrite:
        description: 'Allow manual dispatch to overwrite assets on an existing release'
        required: false
        default: false
        type: boolean
      offer_updates:
        description: 'Register this runtime for compatible installed apps after publishing; requires both app version bounds'
        required: false
        default: true
        type: boolean
      min_app_version:
        description: 'Oldest compatible APK version, e.g. 0.0.161-alpha.1 (inclusive)'
        required: false
        default: ''
        type: string
      max_app_version:
        description: 'Newest compatible APK version, e.g. 0.0.161-beta (inclusive)'
        required: false
        default: ''
        type: string
      promote_current:
        description: 'Beta only: also promote the compatible public installer runtime (leaves APK release unchanged)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  # Keyless sign-in to Google Cloud as the release account (publish-current-release.mjs).
  id-token: write

concurrency:
  group: commaviewd-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  bundle-and-publish:
    name: Build comma-device release bundle + publish assets
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      # A manual run with no tag cuts a release (docs: RhynoTech/CommaView docs/release/README.md):
      # scripts/release-version.mjs names it from the tags already made, the next
      # v<version>-alpha.<n> from main's head, or v<version>-beta from the chosen alpha's commit,
      # and the tag is created here. Tags made with the workflow's token start no other workflow,
      # so this run does the release itself.
      - name: Check out main to cut a release
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Validate runtime rollout before cutting a tag
        if: github.event_name == 'workflow_dispatch'
        env:
          OFFER_UPDATES: ${{ inputs.offer_updates }}
          PROMOTE_CURRENT: ${{ inputs.promote_current }}
          CHANNEL: ${{ inputs.channel }}
          REQUESTED_TAG: ${{ inputs.tag }}
          MIN_APP_VERSION: ${{ inputs.min_app_version }}
          MAX_APP_VERSION: ${{ inputs.max_app_version }}
        run: |
          set -euo pipefail
          if [[ "$PROMOTE_CURRENT" == true && "$OFFER_UPDATES" != true ]]; then
            echo "promote_current requires offer_updates" >&2
            exit 1
          fi
          if [[ "$OFFER_UPDATES" == true ]]; then
            TAG="${REQUESTED_TAG:-v0.0.0-${CHANNEL}}"
            args=(--runtime-tag "$TAG" --min-app-version "$MIN_APP_VERSION" --max-app-version "$MAX_APP_VERSION"
              --sha256 "$(printf '%064d' 0)" --validate-only)
            [[ "$PROMOTE_CURRENT" != true ]] || args+=(--promote-current)
            node scripts/publish-current-release.mjs "${args[@]}"
          fi

      - name: Cut release tag
        id: cut
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          FROM: ${{ inputs.from }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . comma/version.env
          args=(--prefix v --floor "${VERSION%%-*}" --channel "$CHANNEL" --github-output)
          [[ -z "$FROM" ]] || args+=(--from "$FROM")
          node scripts/release-version.mjs "${args[@]}" | tee "$RUNNER_TEMP/next"
          TAG="$(sed -n 's/^tag=//p' "$RUNNER_TEMP/next")"
          FROM_TAG="$(sed -n 's/^from_tag=//p' "$RUNNER_TEMP/next")"
          if [[ -n "$FROM_TAG" ]]; then
            SHA="$(git rev-parse "refs/tags/${FROM_TAG}^{}")"
          else
            SHA="$(git rev-parse HEAD)"
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists" >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA" >/dev/null
          echo "Created $TAG at $SHA"

      - name: Resolve release tag
        id: vars
        env:
          REQUESTED_TAG: ${{ steps.cut.outputs.tag || (github.event_name == 'workflow_dispatch' && inputs.tag) || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${REQUESTED_TAG}"
          if [[ -z "$TAG" ]]; then
            echo "No tag resolved" >&2
            exit 1
          fi
          # An alpha (v0.0.56-alpha.2, or the old single v0.0.56-alpha) or a version's beta.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha(\.[0-9]+)?|beta)$ ]]; then
            echo "Tag must match v<major>.<minor>.<patch>-alpha.<n> or -beta (got: $TAG)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout CommaView
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.vars.outputs.tag }}

      - name: Restore apt package cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/commaview-apt/archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-commaviewd-toolchain-v1
          restore-keys: |
            apt-${{ runner.os }}-${{ runner.arch }}-commaviewd-toolchain-

      - name: Install toolchain + deps
        id: armcapnp
        run: ./scripts/install-commaviewd-toolchain.sh

      - name: Load release upstream ref
        id: release-upstream
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . ci/upstream-refs.env
          [[ -n "${COMMAVIEWD_RELEASE_SUNNYPILOT_REF:-}" ]] || {
            echo "Missing COMMAVIEWD_RELEASE_SUNNYPILOT_REF in ci/upstream-refs.env" >&2
            exit 1
          }
          echo "openpilot_ref=${COMMAVIEWD_RELEASE_SUNNYPILOT_REF}" >> "$GITHUB_OUTPUT"

      - name: Restore upstream source cache
        id: upstream-cache
        uses: actions/cache@v5
        with:
          path: openpilot-src
          key: upstream-src-${{ runner.os }}-sunnypilot-openpilot-${{ steps.release-upstream.outputs.openpilot_ref }}

      - name: Checkout openpilot source
        if: steps.upstream-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: sunnypilot/openpilot
          ref: ${{ steps.release-upstream.outputs.openpilot_ref }}
          path: openpilot-src
          submodules: recursive

      - name: Onroad UI export transformer apply/verify
        run: |
          set -euxo pipefail
          mkdir -p dist
          COMMAVIEWD_INSTALL_DIR="${{ github.workspace }}/comma" COMMAVIEWD_OP_ROOT="${{ github.workspace }}/openpilot-src" ./comma/scripts/apply_onroad_ui_export_patch.sh
          COMMAVIEWD_INSTALL_DIR="${{ github.workspace }}/comma" COMMAVIEWD_OP_ROOT="${{ github.workspace }}/openpilot-src" ./comma/scripts/verify_onroad_ui_export_patch.sh --json >/dev/null
          cp "${{ github.workspace }}/comma/run/onroad-ui-export-status.json" dist/onroad-ui-export-status.json
          git -C "${{ github.workspace }}/openpilot-src" reset --hard -q HEAD
          git -C "${{ github.workspace }}/openpilot-src" clean -fdq

      - name: Run release verification pipeline
        env:
          OP_ROOT: ${{ github.workspace }}/openpilot-src
          ARM_CAPNP_SO: ${{ steps.armcapnp.outputs.arm_capnp_so }}
          ARM_KJ_SO: ${{ steps.armcapnp.outputs.arm_kj_so }}
          RELEASE_SMOKE_TAG: release-smoke-${{ steps.vars.outputs.tag }}-${{ github.run_id }}
        run: |
          set -euxo pipefail
          commaviewd/scripts/run-verification.sh

      - name: Build release bundle
        env:
          OP_ROOT: ${{ github.workspace }}/openpilot-src
          ARM_CAPNP_SO: ${{ steps.armcapnp.outputs.arm_capnp_so }}
          ARM_KJ_SO: ${{ steps.armcapnp.outputs.arm_kj_so }}
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euxo pipefail
          tools/release/comma-build-bundle.sh "$RELEASE_TAG"

      - name: Upload release assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG='${{ steps.vars.outputs.tag }}'
          ASSET_TGZ="release/${TAG}/commaview-comma-${TAG}.tar.gz"
          ASSET_SHA="${ASSET_TGZ}.sha256"
          PROVENANCE_ASSETS=(
            dist/reproducible-build-manifest.json
            dist/upstream-interface-manifest.json
            dist/binary-contract.json
            dist/release-smoke-manifest.json
            dist/onroad-ui-export-status.json
          )
          NOTES_FILE="docs/release/${TAG}-user-facing.md"
          if [[ ! -f "$NOTES_FILE" ]]; then
            NOTES_FILE="release/${TAG}/github-release-notes.txt"
            cat > "$NOTES_FILE" <<EOF
          Automated release for $TAG
          EOF
          fi

          REQUIRED_ASSETS=("$ASSET_TGZ" "$ASSET_SHA" "${PROVENANCE_ASSETS[@]}")
          for asset in "${REQUIRED_ASSETS[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "Missing release asset: $asset" >&2
              exit 1
            fi
          done
          (cd "release/${TAG}" && sha256sum -c "commaview-comma-${TAG}.tar.gz.sha256")
          for manifest in "${PROVENANCE_ASSETS[@]}"; do
            python3 -m json.tool "$manifest" >/dev/null
          done

          release_exists=0
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=1
          fi

          if [[ "$release_exists" = "1" ]]; then
            if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ inputs.allow_overwrite }}" != "true" ]]; then
              echo "Release $TAG already exists; overwrite requires manual dispatch with allow_overwrite=true" >&2
              exit 1
            fi
          fi

          # Alphas are prereleases; a version's beta is the release people get.
          PRERELEASE=--prerelease
          [[ "$TAG" != *-beta ]] || PRERELEASE=--latest
          if [[ "$release_exists" = "0" ]]; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file "$NOTES_FILE" \
              "$PRERELEASE"
          else
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file "$NOTES_FILE" \
              "$PRERELEASE"
          fi

          gh release upload "$TAG" "$ASSET_TGZ" "$ASSET_SHA" "${PROVENANCE_ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      # No key: GitHub's OIDC token signs in as the release account (RhynoTech/commaview-web,
      # account/terraform/releases.tf), which may publish runtime releases and get ID tokens for
      # the account services.
      - name: Sign in to Google Cloud (release account)
        id: gcp
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/263004041190/locations/global/workloadIdentityPools/commaview-github/providers/commaview-releases
          service_account: commaview-release@commaview.iam.gserviceaccount.com
          token_format: access_token

      # Where commas install from: commaview.com/commaviewd/<tag>/ (the install.sh in this release
      # fetches its tarball and companions there, not from GitHub). A tag's files never change.
      - name: Publish the release on commaview.com
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          set -euo pipefail
          TAG='${{ steps.vars.outputs.tag }}'
          tools/release/publish-release-files.sh "$TAG" \
            "release/${TAG}/commaview-comma-${TAG}.tar.gz" \
            "release/${TAG}/commaview-comma-${TAG}.tar.gz.sha256" \
            --shim comma4/install.sh
          # Public (commaview.com serves the bucket; Cloudflare's bot challenge stops GitHub's
          # runners at commaview.com itself).
          curl -fsS -o /dev/null "https://storage.googleapis.com/commaview-runtime-releases/${TAG}/commaview-comma-${TAG}.tar.gz.sha256"


      - name: Checkout release control-plane scripts
        if: github.event_name == 'workflow_dispatch' && inputs.offer_updates == true
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: release-control

      - name: Register independent runtime release
        if: github.event_name == 'workflow_dispatch' && inputs.offer_updates == true
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          RELEASE_ACCOUNT: commaview-release@commaview.iam.gserviceaccount.com
          # Register runtime offers in both account services, independently of APK releases.
          MIN_APP_VERSION: ${{ inputs.min_app_version }}
          MAX_APP_VERSION: ${{ inputs.max_app_version }}
          PROMOTE_CURRENT: ${{ inputs.promote_current }}
          # Account services (RhynoTech/commaview-web, account/):
          # production (commaview.com/api/current-release) first, then staging.
          # Each service's public address (the ID token's audience) | its Cloud Run address, which
          # CI calls directly: Cloudflare's bot challenge stops GitHub's runners at the public one.
          ACCOUNT_SERVICE_URLS: >-
            https://my.commaview.com|https://commaview-account-xpdgughraq-uk.a.run.app,
            https://my-staging.commaview.com|https://commaview-account-staging-xpdgughraq-uk.a.run.app
        run: |
          set -euo pipefail
          TAG='${{ steps.vars.outputs.tag }}'
          SHA256="$(cut -d ' ' -f1 "release/${TAG}/commaview-comma-${TAG}.tar.gz.sha256")"
          args=(--runtime-tag "$TAG" --min-app-version "$MIN_APP_VERSION" --max-app-version "$MAX_APP_VERSION"
            --sha256 "$SHA256" --publish-url "$ACCOUNT_SERVICE_URLS")
          [[ "$PROMOTE_CURRENT" != true ]] || args+=(--promote-current)
          node release-control/scripts/publish-current-release.mjs "${args[@]}"
